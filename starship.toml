# Starship prompt, Catppuccin Mocha, laid out like powerlevel10k's
# "rainbow" style: a two-line prompt with joined, rounded segments on the
# first line and status info on the right of the input line.
#
#   ╭─( 󰣇 | ~/Documents | main ✓ )
#   ╰─❯                                   3s  17:12
#
# p10k itself is on life support upstream (limited support since 2024), and
# Starship can draw the same thing from this one tracked file.
#
# Glyphs below are Nerd Font private-use codepoints (U+E0B4/U+E0B6 caps etc).
# They render as nothing in many editors, so this file is generated with
# explicit escapes. If a cap goes missing, check the bytes with `cat -A`.

format = """
[╭─](fg:surface2)\
[](fg:mauve)\
[  ](fg:crust bg:mauve)\
[](fg:mauve bg:surface1)\
$directory\
[](fg:surface1 bg:surface0)\
$git_branch\
$git_status\
[](fg:surface0)\
$python\
$line_break\
[╰─](fg:surface2)$character"""

right_format = """$cmd_duration$status$jobs$time"""

add_newline = true
palette = "catppuccin_mocha"

[directory]
style = "fg:text bg:surface1"
format = "[ $path ]($style)[$read_only]($read_only_style)"
home_symbol = " ~"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
read_only = "󰌾 "
read_only_style = "fg:red bg:surface1"

[git_branch]
symbol = ""
style = "fg:mauve bg:surface0"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:claude_orange bg:surface0"
format = "[($all_status$ahead_behind )]($style)"

[python]
format = "[ via $symbol$virtualenv]($style)"
style = "fg:yellow"
detect_extensions = []
detect_files = []

# Right side of the input line: only shows what is relevant right now.
[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = "[󰔟 $duration ]($style)"

[status]
disabled = false
symbol = " "
style = "fg:red"
format = "[$symbol$status ]($style)"

[jobs]
style = "fg:sapphire"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:overlay1"
format = "[ $time]($style)"

[character]
success_symbol = "[❯](bold fg:mauve)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"

[palettes.catppuccin_mocha]
rosewater = "#f59575"
flamingo = "#f59575"
pink = "#fd5db1"
mauve = "#af87ff"
red = "#ff6b80"
maroon = "#ff6b80"

# `peach` and `claude_orange` are the same value on purpose: the slot keeps its
# Catppuccin name so the palette stays a drop-in, and the alias reads better at
# the use site. Both are Claude Code's `claude` orange — see PALETTE.md.
claude_orange = "#d77757"
peach = "#d77757"
yellow = "#ffc107"
green = "#4eba65"
teal = "#48968c"
sky = "#48968c"
sapphire = "#6a9bcc"
blue = "#b1b9f9"
lavender = "#b1b9f9"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
