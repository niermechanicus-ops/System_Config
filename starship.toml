# Starship prompt, Catppuccin Mocha.
#
# Replaces oh-my-zsh's default `robbyrussell` theme, which was the one
# un-themed piece of the shell (syntax highlighting was already Mocha).
# Starship is config-file driven rather than wizard-driven, so unlike
# powerlevel10k the whole prompt lives in this one tracked file.
#
# Glyphs below need a Nerd Font — JetBrainsMono Nerd Font is already the
# terminal font in kitty/gtk, so they render as-is.

format = """
[](surface0)\
$directory\
$git_branch\
$git_status\
[](fg:surface0)\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

add_newline = true
palette = "catppuccin_mocha"

[fill]
symbol = " "

[directory]
style = "fg:text bg:surface0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:red bg:surface0"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = " "
"Videos" = " "
"Pictures" = " "
"Music" = " "

[git_branch]
symbol = ""
style = "fg:mauve bg:surface0"
format = "[ on $symbol $branch ]($style)"

[git_status]
style = "fg:claude_orange bg:surface0"
format = "[$all_status$ahead_behind ]($style)"

# Only shown when a command took a noticeable amount of time — keeps the
# prompt quiet for the fast majority.
[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = "[󱎫 $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:overlay1"
format = "[ $time ]($style)"

[character]
success_symbol = "[❯](bold fg:mauve)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"

# The orange accent across this whole setup is Claude's orange, not
# Catppuccin's peach — see waybar/style.css, fastfetch, yazi, kdeglobals.
# `peach` is left at its canonical value below but is deliberately unused;
# reach for claude_orange instead so the accent stays consistent.
claude_orange = "#e57e5a"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
