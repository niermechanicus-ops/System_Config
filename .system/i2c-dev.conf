# Reference copy of /etc/modules-load.d/i2c-dev.conf
#
# Not symlinked (it lives under /etc and needs root), so if this file changes,
# copy it into place:
#     sudo install -Dm644 .system/i2c-dev.conf /etc/modules-load.d/i2c-dev.conf
#
# OpenRGB reaches the DIMM RGB controllers over SMBus via /dev/i2c-*, which
# only exist once i2c-dev is loaded. Nothing else on this box uses the module,
# so it is not autoloaded and has to be requested here -- without it the
# ram-rgb-off service finds no DRAM devices and the sticks light up on boot.
#
# The bus driver itself (i2c-piix4, AMD) does autoload off its ACPI match.
i2c-dev
