# Reference copy of /etc/sddm.conf.d/autologin.conf
#
# Boots straight into Hyprland with no login prompt. Not symlinked (it lives
# under /etc and needs root), so if this file changes, copy it into place:
#     sudo install -Dm644 .system/sddm-autologin.conf \
#         /etc/sddm.conf.d/autologin.conf
#
# Session must be hyprland-uwsm.desktop, not hyprland.desktop: this box runs
# the uwsm-managed session (wayland-wm@hyprland.desktop.service), and pointing
# autologin at the plain session would quietly drop uwsm's systemd unit
# management on next boot.

[Autologin]
User=nier
Session=hyprland-uwsm.desktop

# Deliberately false. With Relogin=true, SDDM logs straight back in the
# instant you log out, which makes logging out or switching users impossible
# without dropping to a TTY. false means: skip the prompt at boot, but show
# the greeter if you explicitly log out.
Relogin=false
