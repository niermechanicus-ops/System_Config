[Settings]
# Mauve accent to match kdeglobals (CatppuccinMochaMauve), so GTK and Qt
# apps land on the same accent colour.
gtk-theme-name=catppuccin-mocha-mauve-standard+default
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=JetBrainsMono Nerd Font 10
gtk-cursor-theme-name=catppuccin-mocha-white
gtk-cursor-theme-size=24
# Tells apps that ask (rather than assume) that this is a dark desktop.
gtk-application-prefer-dark-theme=1
