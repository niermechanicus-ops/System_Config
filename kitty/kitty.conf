include catppuccin-mocha.conf

# Pixel-art pass (2026-10-09): same Departure Mono as waybar/rofi. 16.5pt is
# 22px at scale 1, i.e. the font's 11px grid doubled, so every font pixel is
# exactly 2x2 screen pixels and the cell is a whole 14x28px. Any other size
# makes kitty resample the glyphs and they go soft. The font has one weight,
# so bold/italic fall back to it rather than to a smooth font.
font_family      DepartureMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.5

# Even padding keeps the text on the same 2px grid as the window edge.
window_padding_width 10
background_opacity   0.95
confirm_os_window_close 0

enabled_layouts tall,fat,grid,stack
