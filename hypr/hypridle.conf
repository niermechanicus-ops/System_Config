# Idle daemon — the thing that actually triggers hyprlock.
# hyprlock alone never fires on its own; without hypridle running the
# machine simply never locks. Started from hyprland.lua's autostart block.
#
# Desktop box (no battery), so there is no suspend/hibernate ladder here:
# just lock, then blank the displays to save the panels.

general {
    # `pidof hyprlock ||` guards against stacking a second lock screen on
    # top of an existing one if a listener re-fires.
    lock_cmd = pidof hyprlock || hyprlock
    # Lock *before* the system sleeps, so resuming never flashes the
    # unlocked desktop before the lock screen paints.
    before_sleep_cmd = loginctl lock-session
    # Displays are left off by DPMS after sleep otherwise.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 10 minutes idle -> lock, then blank the displays.
#
# Both actions live in one listener rather than two same-timeout listeners:
# hypridle gives no ordering guarantee between listeners that fire on the
# same tick, and the lock must win. Chaining with && keeps the invariant
# from the old two-stage setup — the panels are never dark while the
# session is still unlocked.
#
# on-resume fires on the next input event (mouse move, keypress), which is
# what wakes the monitors back up.
listener {
    timeout = 600
    on-timeout = loginctl lock-session && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
