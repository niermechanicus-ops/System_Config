# Lock screen, Catppuccin Mocha.
#
# hyprlock was installed but had no config at all, so it fell back to its
# built-in default (bare grey screen). Colours below match kdeglobals /
# rofi / kitty so the lock screen doesn't break the theme.
#
# Mocha refs: base #1e1e2e  crust #11111b  text #cdd6f4
#             surface0 #313244  overlay0 #6c7086  mauve #cba6f7  red #f38ba8

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    # Blur whatever was on screen rather than loading a wallpaper file, so
    # this config stays valid regardless of what hyprpaper is set to.
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.17
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(cdd6f4ff)
    font_size = 112
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 220
    halign = center
    valign = center
}

# Date, quieter than the clock
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(a6adc8ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(313244ff)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086">Enter password</span>
    check_color = rgba(cba6f7ff)
    fail_color = rgba(f38ba8ff)
    fail_text = <span foreground="##f38ba8">$FAIL ($ATTEMPTS)</span>
    rounding = 8
    position = 0, -40
    halign = center
    valign = center
}

# Whose session this is — useful on a machine with more than one account
label {
    monitor =
    text = $USER
    color = rgba(a6adc8ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -110
    halign = center
    valign = center
}
